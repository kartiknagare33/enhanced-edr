<svg width="1200" height="620" viewBox="0 0 1200 620" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#14233A" stroke-width="1.6"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#0a9d63" stroke-width="1.6"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#c0392b" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="620" fill="#ffffff"/>
  <text x="600" y="42" text-anchor="middle" font-size="26" font-weight="700" fill="#1F7FD1">Power Survivability Unit — Block Diagram</text>

  <!-- ============ NORMAL PATH (top row) ============ -->
  <text x="70" y="112" font-size="14" font-weight="700" fill="#0a9d63">NORMAL RUNNING</text>

  <!-- 12V IN -->
  <rect x="60" y="125" width="150" height="70" rx="8" fill="#eef4fb" stroke="#14233A" stroke-width="1.6"/>
  <text x="135" y="158" text-anchor="middle" font-size="16" font-weight="700" fill="#14233A">12 V Input</text>
  <text x="135" y="178" text-anchor="middle" font-size="12" fill="#5B6B7F">switch · fuse · diode</text>

  <!-- Buck -->
  <rect x="290" y="125" width="170" height="70" rx="8" fill="#eef4fb" stroke="#14233A" stroke-width="1.6"/>
  <text x="375" y="152" text-anchor="middle" font-size="16" font-weight="700" fill="#14233A">LM2596 Buck</text>
  <text x="375" y="174" text-anchor="middle" font-size="12" fill="#5B6B7F">steps 12 V → 5.3 V</text>

  <!-- Rail node -->
  <rect x="540" y="125" width="150" height="70" rx="8" fill="#dff3e8" stroke="#0a9d63" stroke-width="1.8"/>
  <text x="615" y="152" text-anchor="middle" font-size="15" font-weight="700" fill="#14233A">5 V Rail</text>
  <text x="615" y="174" text-anchor="middle" font-size="12" fill="#5B6B7F">(RAIL_5V)</text>

  <!-- Raspberry Pi -->
  <rect x="900" y="120" width="230" height="150" rx="10" fill="#f6f8fb" stroke="#14233A" stroke-width="2"/>
  <text x="1015" y="180" text-anchor="middle" font-size="20" font-weight="700" fill="#14233A">Raspberry Pi</text>
  <text x="1015" y="206" text-anchor="middle" font-size="13" fill="#5B6B7F">powered device</text>

  <!-- arrows normal path -->
  <line x1="210" y1="160" x2="288" y2="160" stroke="#14233A" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="460" y1="160" x2="538" y2="160" stroke="#14233A" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="690" y1="160" x2="898" y2="160" stroke="#0a9d63" stroke-width="2.4" marker-end="url(#arrG)"/>
  <text x="795" y="150" text-anchor="middle" font-size="12" fill="#0a9d63">5 V power</text>

  <!-- ============ CHARGE PATH (middle) ============ -->
  <!-- from rail down to TP4056 -->
  <line x1="615" y1="195" x2="615" y2="250" stroke="#14233A" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="540" y="255" width="150" height="66" rx="8" fill="#fff3d6" stroke="#C9821A" stroke-width="1.6"/>
  <text x="615" y="282" text-anchor="middle" font-size="15" font-weight="700" fill="#14233A">TP4056</text>
  <text x="615" y="303" text-anchor="middle" font-size="12" fill="#5B6B7F">charger (protected)</text>

  <!-- TP4056 to battery -->
  <line x1="615" y1="321" x2="615" y2="368" stroke="#14233A" stroke-width="2" marker-end="url(#arr)"/>
  <text x="700" y="348" text-anchor="middle" font-size="12" fill="#5B6B7F">charges</text>

  <!-- 18650 battery -->
  <rect x="520" y="375" width="190" height="72" rx="8" fill="#eaf1fb" stroke="#14233A" stroke-width="1.8"/>
  <text x="615" y="405" text-anchor="middle" font-size="17" font-weight="700" fill="#14233A">18650 Li-ion Cell</text>
  <text x="615" y="427" text-anchor="middle" font-size="12" fill="#5B6B7F">3.7 V backup store</text>

  <!-- ============ BACKUP PATH (bottom) ============ -->
  <text x="70" y="470" font-size="14" font-weight="700" fill="#c0392b">ON POWER CUT</text>

  <!-- battery to boost -->
  <line x1="520" y1="411" x2="300" y2="411" stroke="#c0392b" stroke-width="2.2"/>
  <line x1="300" y1="411" x2="300" y2="500" stroke="#c0392b" stroke-width="2.2"/>
  <line x1="300" y1="500" x2="348" y2="500" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrR)"/>

  <!-- HW-432 boost -->
  <rect x="350" y="465" width="180" height="72" rx="8" fill="#fdeceA" stroke="#c0392b" stroke-width="1.8"/>
  <text x="440" y="494" text-anchor="middle" font-size="16" font-weight="700" fill="#14233A">HW-432 Boost</text>
  <text x="440" y="516" text-anchor="middle" font-size="12" fill="#5B6B7F">3.7 V → 5.1 V</text>

  <!-- boost to schottky -->
  <line x1="530" y1="501" x2="590" y2="501" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrR)"/>
  <!-- schottky block -->
  <rect x="592" y="472" width="150" height="60" rx="8" fill="#fdeceA" stroke="#c0392b" stroke-width="1.6"/>
  <text x="667" y="498" text-anchor="middle" font-size="14" font-weight="700" fill="#14233A">Diode D2</text>
  <text x="667" y="518" text-anchor="middle" font-size="11.5" fill="#5B6B7F">auto-failover</text>

  <!-- schottky up to rail (join) -->
  <line x1="742" y1="501" x2="820" y2="501" stroke="#c0392b" stroke-width="2.2"/>
  <line x1="820" y1="501" x2="820" y2="230" stroke="#c0392b" stroke-width="2.2"/>
  <line x1="820" y1="230" x2="898" y2="230" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrR)"/>
  <text x="858" y="222" text-anchor="middle" font-size="11.5" fill="#c0392b">5 V backup</text>

  <!-- ============ POWER-FAIL SENSE ============ -->
  <rect x="900" y="330" width="230" height="66" rx="8" fill="#f2f4f7" stroke="#5B6B7F" stroke-width="1.4"/>
  <text x="1015" y="357" text-anchor="middle" font-size="14" font-weight="700" fill="#14233A">Power-fail sense</text>
  <text x="1015" y="378" text-anchor="middle" font-size="11.5" fill="#5B6B7F">10k / 2.2k divider → GPIO17</text>
  <line x1="1015" y1="270" x2="1015" y2="328" stroke="#5B6B7F" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- legend -->
  <rect x="60" y="560" width="1080" height="40" rx="6" fill="#fafbfc" stroke="#e2e7ec" stroke-width="1"/>
  <line x1="80" y1="580" x2="115" y2="580" stroke="#0a9d63" stroke-width="3"/>
  <text x="125" y="585" font-size="13" fill="#14233A">Normal power path (12 V present)</text>
  <line x1="430" y1="580" x2="465" y2="580" stroke="#c0392b" stroke-width="3"/>
  <text x="475" y="585" font-size="13" fill="#14233A">Backup path (12 V lost — battery holds the Pi up)</text>
  <text x="900" y="585" font-size="12" fill="#5B6B7F">Failover is automatic; no software needed.</text>
</svg>
