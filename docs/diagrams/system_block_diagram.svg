<svg width="1320" height="740" viewBox="0 0 1320 740" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#14233A" stroke-width="1.6"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#C9821A" stroke-width="1.6"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1320" height="740" fill="#ffffff"/>
  <text x="660" y="42" text-anchor="middle" font-size="26" font-weight="700" fill="#1F7FD1">Enhanced Event Data Recorder — System Block Diagram</text>

  <!-- ================= NODE A ================= -->
  <rect x="40" y="90" width="300" height="250" rx="12" fill="#f3f7fc" stroke="#1F7FD1" stroke-width="2"/>
  <text x="190" y="120" text-anchor="middle" font-size="17" font-weight="700" fill="#1F7FD1">NODE A — Vehicle ECU</text>
  <text x="190" y="140" text-anchor="middle" font-size="12" fill="#5B6B7F">(CAN transmitter)</text>

  <rect x="70" y="160" width="240" height="60" rx="8" fill="#ffffff" stroke="#14233A" stroke-width="1.5"/>
  <text x="190" y="185" text-anchor="middle" font-size="15" font-weight="700" fill="#14233A">ESP32</text>
  <text x="190" y="205" text-anchor="middle" font-size="11.5" fill="#5B6B7F">generates vehicle data frames</text>

  <rect x="70" y="240" width="240" height="60" rx="8" fill="#ffffff" stroke="#14233A" stroke-width="1.5"/>
  <text x="190" y="265" text-anchor="middle" font-size="15" font-weight="700" fill="#14233A">MCP2515 CAN</text>
  <text x="190" y="285" text-anchor="middle" font-size="11.5" fill="#5B6B7F">controller + transceiver</text>
  <line x1="190" y1="220" x2="190" y2="238" stroke="#14233A" stroke-width="2" marker-end="url(#a)"/>

  <!-- CAN BUS link to Node B -->
  <line x1="340" y1="270" x2="470" y2="270" stroke="#14233A" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="405" y="258" text-anchor="middle" font-size="13" font-weight="700" fill="#14233A">CAN bus</text>
  <text x="405" y="290" text-anchor="middle" font-size="11" fill="#5B6B7F">CANH / CANL</text>

  <!-- ================= NODE B ================= -->
  <rect x="470" y="70" width="470" height="470" rx="12" fill="#f3f7fc" stroke="#1F7FD1" stroke-width="2"/>
  <text x="705" y="100" text-anchor="middle" font-size="17" font-weight="700" fill="#1F7FD1">NODE B — EDR Unit</text>
  <text x="705" y="120" text-anchor="middle" font-size="12" fill="#5B6B7F">Raspberry Pi 4B (recorder)</text>

  <!-- Pi core -->
  <rect x="560" y="150" width="290" height="70" rx="8" fill="#e9f0fb" stroke="#14233A" stroke-width="1.8"/>
  <text x="705" y="180" text-anchor="middle" font-size="16" font-weight="700" fill="#14233A">Raspberry Pi 4B</text>
  <text x="705" y="202" text-anchor="middle" font-size="11.5" fill="#5B6B7F">acquisition · detection · storage</text>

  <!-- sensor blocks around/under the Pi -->
  <!-- IMU -->
  <rect x="500" y="260" width="190" height="58" rx="7" fill="#ffffff" stroke="#14233A" stroke-width="1.4"/>
  <text x="595" y="284" text-anchor="middle" font-size="13.5" font-weight="700" fill="#14233A">MPU6050 IMU</text>
  <text x="595" y="303" text-anchor="middle" font-size="11" fill="#5B6B7F">accel + gyro · I²C</text>
  <!-- GPS -->
  <rect x="720" y="260" width="190" height="58" rx="7" fill="#ffffff" stroke="#14233A" stroke-width="1.4"/>
  <text x="815" y="284" text-anchor="middle" font-size="13.5" font-weight="700" fill="#14233A">NEO-6M GPS</text>
  <text x="815" y="303" text-anchor="middle" font-size="11" fill="#5B6B7F">location / speed · UART</text>
  <!-- RTC -->
  <rect x="500" y="332" width="190" height="58" rx="7" fill="#ffffff" stroke="#14233A" stroke-width="1.4"/>
  <text x="595" y="356" text-anchor="middle" font-size="13.5" font-weight="700" fill="#14233A">DS3231 RTC</text>
  <text x="595" y="375" text-anchor="middle" font-size="11" fill="#5B6B7F">timestamps · I²C</text>
  <!-- CAN rx -->
  <rect x="720" y="332" width="190" height="58" rx="7" fill="#ffffff" stroke="#14233A" stroke-width="1.4"/>
  <text x="815" y="356" text-anchor="middle" font-size="13.5" font-weight="700" fill="#14233A">MCP2515 CAN</text>
  <text x="815" y="375" text-anchor="middle" font-size="11" fill="#5B6B7F">receives Node A · SPI</text>
  <!-- Flash -->
  <rect x="610" y="404" width="190" height="62" rx="7" fill="#fff6e6" stroke="#C9821A" stroke-width="1.6"/>
  <text x="705" y="429" text-anchor="middle" font-size="13.5" font-weight="700" fill="#14233A">W25Q128 Flash</text>
  <text x="705" y="448" text-anchor="middle" font-size="11" fill="#5B6B7F">tamper-locked crash record · SPI</text>

  <!-- connect Pi to sensors -->
  <g stroke="#14233A" stroke-width="1.6" fill="none">
    <line x1="595" y1="220" x2="595" y2="258" marker-end="url(#a)"/>
    <line x1="815" y1="220" x2="815" y2="258" marker-end="url(#a)"/>
    <line x1="595" y1="318" x2="595" y2="330" marker-end="url(#a)"/>
    <line x1="815" y1="318" x2="815" y2="330" marker-end="url(#a)"/>
    <line x1="705" y1="366" x2="705" y2="402" marker-end="url(#a)"/>
  </g>

  <!-- ================= OUTPUT / ANALYSIS ================= -->
  <rect x="1000" y="120" width="280" height="150" rx="12" fill="#eef7f1" stroke="#0a9d63" stroke-width="2"/>
  <text x="1140" y="150" text-anchor="middle" font-size="16" font-weight="700" fill="#0a9d63">Analysis &amp; Reconstruction</text>
  <text x="1140" y="178" text-anchor="middle" font-size="12" fill="#5B6B7F">Forensic workstation (software)</text>
  <text x="1140" y="205" text-anchor="middle" font-size="11.5" fill="#5B6B7F">crash pulse · Δv · HIC · trajectory</text>
  <text x="1140" y="224" text-anchor="middle" font-size="11.5" fill="#5B6B7F">kinematics · report · integrity</text>
  <line x1="940" y1="300" x2="1000" y2="300" stroke="#14233A" stroke-width="2" marker-end="url(#a)"/>
  <line x1="970" y1="300" x2="970" y2="195" stroke="#14233A" stroke-width="2"/>
  <line x1="970" y1="195" x2="998" y2="195" stroke="#14233A" stroke-width="2" marker-end="url(#a)"/>
  <text x="955" y="330" text-anchor="middle" font-size="11" fill="#5B6B7F">recorded data</text>

  <!-- ================= POWER SURVIVABILITY UNIT ================= -->
  <rect x="470" y="580" width="470" height="130" rx="12" fill="#fff6e6" stroke="#C9821A" stroke-width="2"/>
  <text x="705" y="608" text-anchor="middle" font-size="16" font-weight="700" fill="#C9821A">Power Survivability Unit</text>
  <!-- inner blocks -->
  <rect x="495" y="625" width="130" height="62" rx="7" fill="#ffffff" stroke="#14233A" stroke-width="1.3"/>
  <text x="560" y="650" text-anchor="middle" font-size="12.5" font-weight="700" fill="#14233A">12 V → Buck</text>
  <text x="560" y="669" text-anchor="middle" font-size="10.5" fill="#5B6B7F">LM2596 · 5 V</text>
  <rect x="640" y="625" width="130" height="62" rx="7" fill="#ffffff" stroke="#14233A" stroke-width="1.3"/>
  <text x="705" y="650" text-anchor="middle" font-size="12.5" font-weight="700" fill="#14233A">18650 + TP4056</text>
  <text x="705" y="669" text-anchor="middle" font-size="10.5" fill="#5B6B7F">Li-ion backup</text>
  <rect x="785" y="625" width="130" height="62" rx="7" fill="#ffffff" stroke="#14233A" stroke-width="1.3"/>
  <text x="850" y="650" text-anchor="middle" font-size="12.5" font-weight="700" fill="#14233A">Boost → 5 V</text>
  <text x="850" y="669" text-anchor="middle" font-size="10.5" fill="#5B6B7F">HW-432 · on cut</text>
  <g stroke="#C9821A" stroke-width="1.5" fill="none">
    <line x1="625" y1="656" x2="638" y2="656" marker-end="url(#ao)"/>
    <line x1="770" y1="656" x2="783" y2="656" marker-end="url(#ao)"/>
  </g>
  <!-- power up to Pi -->
  <line x1="705" y1="580" x2="705" y2="468" stroke="#C9821A" stroke-width="2.5" marker-end="url(#ao)"/>
  <text x="725" y="530" font-size="12" font-weight="700" fill="#C9821A">5 V power</text>
  <text x="725" y="548" font-size="10.5" fill="#5B6B7F">(survives power cut)</text>

  <!-- ================= LEGEND ================= -->
  <rect x="40" y="410" width="300" height="130" rx="10" fill="#fafbfc" stroke="#e2e7ec" stroke-width="1"/>
  <text x="60" y="438" font-size="13" font-weight="700" fill="#14233A">Capture sequence</text>
  <text x="60" y="462" font-size="12" fill="#333F4D">1. Detect crash (4 triggers)</text>
  <text x="60" y="482" font-size="12" fill="#333F4D">2. Freeze 20 s buffer</text>
  <text x="60" y="502" font-size="12" fill="#333F4D">3. Write to flash</text>
  <text x="60" y="522" font-size="12" fill="#333F4D">4. Lock + verify SHA-256</text>
</svg>
