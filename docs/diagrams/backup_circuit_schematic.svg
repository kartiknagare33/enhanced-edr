<svg width="1300" height="760" viewBox="0 0 1300 760" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="1300" height="760" fill="#ffffff"/>
  <text x="650" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#14233A">Power Survivability Unit — Circuit Schematic (18650 backup)</text>

  <!-- style defs -->
  <g stroke="#14233A" stroke-width="2" fill="none" stroke-linecap="round">

  <!-- ================= INPUT ROW (y=120) ================= -->
  <!-- 12V + terminal -->
  <circle cx="70" cy="120" r="5" fill="#14233A"/>
  <line x1="70" y1="120" x2="120" y2="120"/>
  <!-- SW1 switch -->
  <line x1="120" y1="120" x2="150" y2="105"/>
  <circle cx="120" cy="120" r="3" fill="#14233A"/>
  <circle cx="155" cy="120" r="3" fill="#14233A"/>
  <line x1="155" y1="120" x2="205" y2="120"/>
  <!-- F1 fuse -->
  <rect x="205" y="110" width="55" height="20" rx="4"/>
  <line x1="205" y1="120" x2="260" y2="120" stroke-width="1"/>
  <line x1="260" y1="120" x2="300" y2="120"/>
  <!-- D1 diode (triangle) -->
  <polygon points="300,108 300,132 326,120" fill="#14233A" stroke="none"/>
  <line x1="326" y1="108" x2="326" y2="132"/>
  <line x1="326" y1="120" x2="400" y2="120"/>
  <!-- P12 node -->
  <circle cx="400" cy="120" r="5" fill="#14233A"/>
  <line x1="400" y1="120" x2="470" y2="120"/>
  </g>
  <text x="55" y="108" font-size="12" fill="#5B6B7F">12V+</text>
  <text x="132" y="98" font-size="11" fill="#5B6B7F">SW1</text>
  <text x="232" y="103" font-size="11" fill="#5B6B7F" text-anchor="middle">F1 2A</text>
  <text x="313" y="150" font-size="11" fill="#5B6B7F" text-anchor="middle">D1 1N5401</text>
  <text x="400" y="108" font-size="12" font-weight="700" fill="#14233A" text-anchor="middle">P12</text>

  <!-- LM2596 buck -->
  <rect x="470" y="85" width="160" height="90" rx="6" fill="#eef4fb" stroke="#14233A" stroke-width="1.8"/>
  <text x="550" y="120" text-anchor="middle" font-size="15" font-weight="700" fill="#14233A">LM2596</text>
  <text x="550" y="140" text-anchor="middle" font-size="11.5" fill="#5B6B7F">Buck · 5.3 V</text>
  <text x="478" y="112" font-size="10" fill="#5B6B7F">IN+</text>
  <text x="600" y="112" font-size="10" fill="#5B6B7F">OUT+</text>
  <text x="478" y="168" font-size="10" fill="#5B6B7F">GND</text>

  <!-- rail out -->
  <g stroke="#14233A" stroke-width="2" fill="none" stroke-linecap="round">
  <line x1="630" y1="120" x2="740" y2="120"/>
  <circle cx="740" cy="120" r="5" fill="#14233A"/>   <!-- RAIL_5V node -->
  <line x1="740" y1="120" x2="1120" y2="120"/>
  </g>
  <text x="742" y="108" font-size="12" font-weight="700" fill="#0a9d63" text-anchor="middle">RAIL_5V</text>

  <!-- Raspberry Pi -->
  <rect x="1120" y="85" width="150" height="150" rx="8" fill="#f6f8fb" stroke="#14233A" stroke-width="2"/>
  <text x="1195" y="150" text-anchor="middle" font-size="16" font-weight="700" fill="#14233A">Raspberry</text>
  <text x="1195" y="172" text-anchor="middle" font-size="16" font-weight="700" fill="#14233A">Pi</text>
  <text x="1128" y="112" font-size="10" fill="#5B6B7F">5V</text>
  <text x="1128" y="212" font-size="10" fill="#5B6B7F">GPIO17</text>

  <!-- ================= POWER-FAIL DIVIDER (from P12 down) ================= -->
  <g stroke="#14233A" stroke-width="2" fill="none" stroke-linecap="round">
  <line x1="400" y1="120" x2="400" y2="200"/>
  <!-- R1 -->
  <rect x="388" y="200" width="24" height="55" rx="3"/>
  <line x1="400" y1="255" x2="400" y2="300"/>
  <circle cx="400" cy="300" r="5" fill="#14233A"/>   <!-- NODE_A -->
  <!-- R2 -->
  <rect x="388" y="300" width="24" height="55" rx="3"/>
  <line x1="400" y1="355" x2="400" y2="400"/>
  <!-- GND -->
  <line x1="385" y1="400" x2="415" y2="400"/>
  <line x1="390" y1="406" x2="410" y2="406"/>
  <line x1="395" y1="412" x2="405" y2="412"/>
  <!-- NODE_A to GPIO17 -->
  <line x1="400" y1="300" x2="1050" y2="300"/>
  <line x1="1050" y1="300" x2="1050" y2="210"/>
  <line x1="1050" y1="210" x2="1120" y2="210"/>
  </g>
  <text x="425" y="232" font-size="11" fill="#5B6B7F">R1 10k</text>
  <text x="425" y="332" font-size="11" fill="#5B6B7F">R2 2.2k</text>
  <text x="400" y="292" font-size="11" font-weight="700" fill="#14233A" text-anchor="middle">NODE_A</text>
  <text x="720" y="292" font-size="11" fill="#5B6B7F">power-fail sense → GPIO17</text>

  <!-- ================= CHARGER + BATTERY (middle) ================= -->
  <!-- rail down to TP4056 -->
  <g stroke="#14233A" stroke-width="2" fill="none" stroke-linecap="round">
  <line x1="900" y1="120" x2="900" y2="360"/>
  <circle cx="900" cy="120" r="5" fill="#14233A"/>
  </g>
  <rect x="820" y="360" width="160" height="80" rx="6" fill="#fff3d6" stroke="#C9821A" stroke-width="1.8"/>
  <text x="900" y="392" text-anchor="middle" font-size="15" font-weight="700" fill="#14233A">TP4056</text>
  <text x="900" y="412" text-anchor="middle" font-size="11.5" fill="#5B6B7F">charger (protected)</text>
  <text x="828" y="382" font-size="10" fill="#5B6B7F">IN+</text>
  <text x="946" y="382" font-size="10" fill="#5B6B7F">OUT+</text>
  <text x="900" y="356" font-size="10" fill="#5B6B7F" text-anchor="middle">from 5 V rail</text>

  <!-- TP4056 B+ to battery -->
  <g stroke="#14233A" stroke-width="2" fill="none" stroke-linecap="round">
  <line x1="900" y1="440" x2="900" y2="490"/>
  </g>
  <!-- 18650 battery symbol -->
  <g stroke="#14233A" stroke-width="2" fill="none">
  <line x1="860" y1="500" x2="940" y2="500"/>   <!-- long plate + -->
  <line x1="875" y1="512" x2="925" y2="512" stroke-width="4"/> <!-- short plate - -->
  </g>
  <text x="955" y="500" font-size="12" fill="#5B6B7F">+</text>
  <text x="955" y="518" font-size="12" fill="#5B6B7F">−</text>
  <text x="900" y="540" font-size="13" font-weight="700" fill="#14233A" text-anchor="middle">18650  3.7 V</text>

  <!-- ================= BOOST (backup) ================= -->
  <!-- battery + to boost IN+ -->
  <g stroke="#c0392b" stroke-width="2" fill="none" stroke-linecap="round">
  <line x1="860" y1="500" x2="700" y2="500"/>
  <line x1="700" y1="500" x2="700" y2="470"/>
  </g>
  <rect x="600" y="470" width="180" height="80" rx="6" fill="#fdeceA" stroke="#c0392b" stroke-width="1.8"/>
  <text x="690" y="502" text-anchor="middle" font-size="15" font-weight="700" fill="#14233A">HW-432 Boost</text>
  <text x="690" y="523" text-anchor="middle" font-size="11.5" fill="#5B6B7F">XL6009 · 5.1 V</text>
  <text x="608" y="492" font-size="10" fill="#5B6B7F">IN+</text>
  <text x="752" y="492" font-size="10" fill="#5B6B7F">OUT+</text>

  <!-- boost OUT+ to D2 schottky -->
  <g stroke="#c0392b" stroke-width="2" fill="none" stroke-linecap="round">
  <line x1="600" y1="500" x2="540" y2="500"/>
  </g>
  <!-- D2 schottky (diode symbol, cathode has bracket) -->
  <polygon points="540,488 540,512 516,500" fill="#c0392b" stroke="none"/>
  <g stroke="#c0392b" stroke-width="2" fill="none">
    <line x1="516" y1="488" x2="516" y2="512"/>
    <line x1="516" y1="488" x2="510" y2="482"/>   <!-- schottky ticks -->
    <line x1="516" y1="512" x2="522" y2="518"/>
  </g>
  <text x="528" y="470" font-size="11" fill="#c0392b" text-anchor="middle">D2 1N5819</text>
  <!-- D2 to rail node (route left of the divider, then up to RAIL_5V) -->
  <g stroke="#c0392b" stroke-width="2" fill="none" stroke-linecap="round">
  <line x1="516" y1="500" x2="340" y2="500"/>
  <line x1="340" y1="500" x2="340" y2="120"/>
  <line x1="340" y1="120" x2="400" y2="120"/>
  </g>
  <text x="325" y="320" font-size="11" fill="#c0392b" text-anchor="middle" transform="rotate(-90 325 320)">5 V backup → rail</text>

  <!-- ================= COMMON GND rail ================= -->
  <g stroke="#14233A" stroke-width="1.6" fill="none" stroke-linecap="round">
  <line x1="120" y1="660" x2="1200" y2="660"/>
  <!-- ground taps -->
  <line x1="550" y1="175" x2="550" y2="660"/>
  <line x1="900" y1="512" x2="900" y2="660"/>
  <line x1="690" y1="550" x2="690" y2="660"/>
  <line x1="1195" y1="235" x2="1195" y2="660"/>
  <line x1="70" y1="200" x2="70" y2="660"/>
  </g>
  <!-- 12V - terminal to gnd -->
  <circle cx="70" cy="200" r="5" fill="#14233A"/>
  <text x="48" y="205" font-size="12" fill="#5B6B7F">12V−</text>
  <!-- GND symbol -->
  <g stroke="#14233A" stroke-width="2" fill="none">
  <line x1="645" y1="660" x2="675" y2="660"/>
  <line x1="650" y1="668" x2="670" y2="668"/>
  <line x1="655" y1="676" x2="665" y2="676"/>
  </g>
  <text x="660" y="700" font-size="12" fill="#5B6B7F" text-anchor="middle">common GND</text>

  <!-- note -->
  <text x="650" y="735" text-anchor="middle" font-size="12.5" fill="#5B6B7F">Set LM2596 = 5.3 V and HW-432 = 5.1 V before connecting the Pi.  During normal running the buck holds the rail; on power-cut the boost feeds it through D2 automatically.</text>
</svg>
